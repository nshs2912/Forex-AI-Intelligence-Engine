name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q forex_ai app.py scripts
      - run: python -m pytest -q
      - name: Generate live-readiness report
        run: python scripts/generate_readiness_report.py --output /tmp/live_readiness_report.json
      - name: Verify governance state
        run: |
          python - <<'PY'
          import json
          report = json.load(open("/tmp/live_readiness_report.json", encoding="utf-8"))
          assert report["system_status"] == "GOVERNED / NOT LIVE"
          assert report["approval_policy"] == "evidence_and_human_approval_required"
          print("Governance state verified")
          PY
