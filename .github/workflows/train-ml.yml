name: ML Training

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Train major-pair models
        run: |
          for symbol in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD" "USD/CHF" "USD/CAD" "NZD/USD"; do
            python -m forex_ai.training.train_forex --symbol "$symbol" --output-dir models
          done
      - name: Validate generated model files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("models").glob("*/model.json"):
              payload = json.loads(path.read_text())
              assert payload["status"] == "trained_not_approved_for_live"
              assert payload["calibration"] == "platt_sigmoid"
              assert payload["metrics"]["test_rows"] >= 100
          print("Model artifacts validated")
          PY
      - name: Commit trained model registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --cached --quiet || git commit -m "Train calibrated Forex ML models"
          git push
