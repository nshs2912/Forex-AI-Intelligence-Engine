name: Live ML Training

on:
  workflow_dispatch:

concurrency:
  group: live-ml-training
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train-live:
    runs-on: ubuntu-latest
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FOREX_TRAINING_DATA_SOURCE: live
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require live data secret
        run: |
          test -n "$TWELVE_DATA_API_KEY" || {
            echo "TWELVE_DATA_API_KEY GitHub secret is required for live retraining."
            exit 1
          }
      - name: Train major-pair models from current provider data
        run: |
          for symbol in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD" "USD/CHF" "USD/CAD" "NZD/USD"; do
            python -m forex_ai.training.train_forex --symbol "$symbol" --output-dir models
          done
      - name: Verify artifacts remain governed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("models").glob("*/model.json"):
              payload = json.loads(path.read_text())
              assert payload["status"] == "trained_not_approved_for_live"
              assert payload["metrics"]["data_source"] == "Twelve Data"
          print("Live-data training artifacts created; approval remains blocked pending validation.")
          PY
      - name: Commit retrained models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi
          git commit -m "Retrain Forex ML models from live provider data"
          git pull --rebase origin main
          git push
